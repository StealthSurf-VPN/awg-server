name: CI / Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify formatting
        shell: bash
        run: |
          set -Eeuo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'The following Go files are not formatted:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Verify modules
        run: go mod verify

      - name: Lint workflow and shell automation
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -w /repo \
            koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb \
            scripts/install.sh \
            scripts/install_test.sh \
            scripts/release-marker.sh \
            scripts/release-marker_test.sh \
            scripts/release-notes.sh \
            scripts/release-notes_test.sh \
            scripts/release-previous-tag.sh \
            scripts/release-previous-tag_test.sh

      - name: Test release automation
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/install_test.sh
          bash scripts/release-marker_test.sh
          bash scripts/release-notes_test.sh
          bash scripts/release-previous-tag_test.sh

      - name: Test Go code
        run: go test -race -count=1 ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o "$RUNNER_TEMP/awg-server" .

      - name: Verify working tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

  release_intent:
    name: Detect release marker
    needs:
      - verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.detect.outputs.tag }}
      version: ${{ steps.detect.outputs.version }}
      previous_tag: ${{ steps.previous.outputs.previous_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Detect strict release marker
        id: detect
        shell: bash
        run: |
          set -Eeuo pipefail

          context_file="$RUNNER_TEMP/release-context.txt"
          git show -s --format=%B "$GITHUB_SHA" > "$context_file"

          tag=$(bash scripts/release-marker.sh < "$context_file")
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

          if [ -z "$tag" ]; then
            printf 'No release marker found\n'
            printf 'version=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'version=%s\n' "${tag#v}" >> "$GITHUB_OUTPUT"
          printf 'Release %s requested\n' "$tag"

      - name: Resolve previous stable release
        id: previous
        if: steps.detect.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.detect.outputs.tag }}
        run: |
          set -Eeuo pipefail

          stable_tags_file="$RUNNER_TEMP/stable-release-tags.txt"
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            > "$stable_tags_file"

          previous_tag=$(bash scripts/release-previous-tag.sh "$TAG" < "$stable_tags_file")

          printf 'previous_tag=%s\n' "$previous_tag" >> "$GITHUB_OUTPUT"
          printf 'Previous stable release: %s\n' "${previous_tag:-none}"

  package:
    name: Package release
    needs:
      - release_intent
    if: needs.release_intent.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build release bundle
        shell: bash
        env:
          VERSION: ${{ needs.release_intent.outputs.version }}
          PREVIOUS_TAG: ${{ needs.release_intent.outputs.previous_tag }}
          RELEASE_PUBLIC_KEY: ${{ vars.AWG_RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          set -Eeuo pipefail

          [ -n "$RELEASE_PUBLIC_KEY" ] || {
            printf 'AWG_RELEASE_SIGNING_PUBLIC_KEY is required\n' >&2
            exit 1
          }
          public_key="$RUNNER_TEMP/release-signing-public.pem"
          trap 'rm -f -- "$public_key"' EXIT
          umask 077
          printf '%s' "$RELEASE_PUBLIC_KEY" | base64 --decode > "$public_key"
          key_description=$(openssl pkey -pubin -in "$public_key" -text -noout)
          key_type=${key_description%%$'\n'*}
          unset key_description
          [ "$key_type" = 'ED25519 Public-Key:' ] || {
            printf 'AWG_RELEASE_SIGNING_PUBLIC_KEY must contain an Ed25519 public key\n' >&2
            exit 1
          }
          canonical_public_key=$(openssl base64 -A -in "$public_key")
          [ "$canonical_public_key" = "$RELEASE_PUBLIC_KEY" ] || {
            printf 'AWG_RELEASE_SIGNING_PUBLIC_KEY must be canonical base64 without whitespace\n' >&2
            exit 1
          }

          release_notes_args=("$VERSION" CHANGELOG.md)
          if [ -n "$PREVIOUS_TAG" ]; then
            release_notes_args+=("$PREVIOUS_TAG" "$GITHUB_REPOSITORY")
          fi
          bash scripts/release-notes.sh "${release_notes_args[@]}" > release-notes.md

          make build-all \
            VERSION="$VERSION" \
            RELEASE_PUBLIC_KEY="$RELEASE_PUBLIC_KEY"
          AWG_EXPECTED_RELEASE_PUBLIC_KEY="$RELEASE_PUBLIC_KEY" go test -count=1 \
            -run '^TestEmbeddedReleasePublicKey$' \
            -ldflags="-X github.com/stealthsurf-vpn/awg-server/internal/update.releasePublicKey=$RELEASE_PUBLIC_KEY" \
            ./internal/update

          expected_assets=(
            awg-server-darwin-amd64
            awg-server-darwin-arm64
            awg-server-linux-amd64
            awg-server-linux-arm64
            awg-server-windows-amd64.exe
            awg-server-windows-arm64.exe
          )
          for asset in "${expected_assets[@]}"; do
            test -f "dist/$asset"
            grep -aFq -- "$RELEASE_PUBLIC_KEY" "dist/$asset" || {
              printf 'Release public key is not embedded in %s\n' "$asset" >&2
              exit 1
            }
          done

          actual_count=$(find dist -maxdepth 1 -type f -name 'awg-server-*' | wc -l | tr -d '[:space:]')
          [ "$actual_count" -eq "${#expected_assets[@]}" ]
          [ "$(dist/awg-server-linux-amd64 version)" = "awg-server $VERSION" ]

          (
            cd dist
            sha256sum "${expected_assets[@]}" > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          test ! -e dist/SHA256SUMS.sig
          rm -f -- "$public_key"
          trap - EXIT

          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release-${{ needs.release_intent.outputs.tag }}
          path: |
            dist/
            release-notes.md
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  sign:
    name: Sign release
    needs:
      - release_intent
      - package
    if: needs.release_intent.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    environment:
      name: release-signing
    env:
      RELEASE_PUBLIC_KEY: ${{ vars.AWG_RELEASE_SIGNING_PUBLIC_KEY }}
    steps:
      - name: Download unsigned release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-release-${{ needs.release_intent.outputs.tag }}
          path: bundle

      - name: Validate unsigned release bundle
        shell: bash
        run: |
          set -Eeuo pipefail

          expected_files="$RUNNER_TEMP/expected-files.txt"
          actual_files="$RUNNER_TEMP/actual-files.txt"
          [ -n "$RELEASE_PUBLIC_KEY" ] || {
            printf 'AWG_RELEASE_SIGNING_PUBLIC_KEY is required\n' >&2
            exit 1
          }
          cat > "$expected_files" <<'FILES'
          dist/SHA256SUMS
          dist/awg-server-darwin-amd64
          dist/awg-server-darwin-arm64
          dist/awg-server-linux-amd64
          dist/awg-server-linux-arm64
          dist/awg-server-windows-amd64.exe
          dist/awg-server-windows-arm64.exe
          release-notes.md
          FILES
          find bundle -type f -printf '%P\n' | sort > "$actual_files"
          diff --unified "$expected_files" "$actual_files"
          test -s bundle/release-notes.md

          expected_assets=(
            awg-server-darwin-amd64
            awg-server-darwin-arm64
            awg-server-linux-amd64
            awg-server-linux-arm64
            awg-server-windows-amd64.exe
            awg-server-windows-arm64.exe
          )
          mapfile -t manifest_lines < bundle/dist/SHA256SUMS
          [ "${#manifest_lines[@]}" -eq "${#expected_assets[@]}" ]
          for index in "${!expected_assets[@]}"; do
            [[ ${manifest_lines[index]} =~ ^([0-9a-f]{64})[[:space:]][[:space:]](.+)$ ]] || {
              printf 'SHA256SUMS has an unexpected line %d\n' "$((index + 1))" >&2
              exit 1
            }
            [ "${BASH_REMATCH[2]}" = "${expected_assets[index]}" ] || {
              printf 'SHA256SUMS has an unexpected asset on line %d\n' "$((index + 1))" >&2
              exit 1
            }
            grep -aFq -- \
              "$RELEASE_PUBLIC_KEY" \
              "bundle/dist/${expected_assets[index]}" || {
              printf 'Release public key is not embedded in %s\n' \
                "${expected_assets[index]}" >&2
              exit 1
            }
          done
          (
            cd bundle/dist
            sha256sum --check --strict SHA256SUMS
          )

      - name: Sign checksum manifest
        shell: bash
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.AWG_RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail

          [ -n "$SIGNING_PRIVATE_KEY" ] || {
            printf 'AWG_RELEASE_SIGNING_PRIVATE_KEY is required\n' >&2
            exit 1
          }
          [ -n "$RELEASE_PUBLIC_KEY" ] || {
            printf 'AWG_RELEASE_SIGNING_PUBLIC_KEY is required\n' >&2
            exit 1
          }

          signing_key="$RUNNER_TEMP/release-signing-private.pem"
          derived_public_key="$RUNNER_TEMP/derived-release-signing-public.pem"
          expected_public_key="$RUNNER_TEMP/expected-release-signing-public.pem"
          signature="$PWD/bundle/dist/SHA256SUMS.sig"
          trap 'rm -f -- "$signing_key" "$derived_public_key" "$expected_public_key"' EXIT
          umask 077
          printf '%s\n' "$SIGNING_PRIVATE_KEY" > "$signing_key"
          printf '%s' "$RELEASE_PUBLIC_KEY" | base64 --decode > "$expected_public_key"

          openssl pkey -in "$signing_key" -pubout -out "$derived_public_key"
          derived_key_description=$(openssl pkey -pubin -in "$derived_public_key" -text -noout)
          derived_key_type=${derived_key_description%%$'\n'*}
          unset derived_key_description
          [ "$derived_key_type" = 'ED25519 Public-Key:' ] || {
            printf 'AWG_RELEASE_SIGNING_PRIVATE_KEY must contain an Ed25519 private key\n' >&2
            exit 1
          }
          expected_key_description=$(openssl pkey -pubin -in "$expected_public_key" -text -noout)
          expected_key_type=${expected_key_description%%$'\n'*}
          unset expected_key_description
          [ "$expected_key_type" = 'ED25519 Public-Key:' ] || {
            printf 'AWG_RELEASE_SIGNING_PUBLIC_KEY must contain an Ed25519 public key\n' >&2
            exit 1
          }

          cmp --silent "$derived_public_key" "$expected_public_key" || {
            printf 'Release signing private and public keys do not match\n' >&2
            exit 1
          }

          openssl pkeyutl -sign -rawin \
            -inkey "$signing_key" \
            -in bundle/dist/SHA256SUMS \
            -out "$signature"
          [ "$(stat -c %s "$signature")" -eq 64 ]
          openssl pkeyutl -verify -rawin -pubin \
            -inkey "$expected_public_key" \
            -sigfile "$signature" \
            -in bundle/dist/SHA256SUMS

          rm -f -- "$signing_key" "$derived_public_key" "$expected_public_key"
          trap - EXIT

      - name: Upload signed release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.release_intent.outputs.tag }}
          path: bundle/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  publish:
    name: Publish release
    needs:
      - release_intent
      - sign
    if: needs.release_intent.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: awg-server-release
      cancel-in-progress: false
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.release_intent.outputs.tag }}
          path: bundle

      - name: Validate release version and tag
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release_intent.outputs.tag }}
          EXPECTED_PREVIOUS_TAG: ${{ needs.release_intent.outputs.previous_tag }}
        run: |
          set -Eeuo pipefail

          existing_release="$RUNNER_TEMP/existing-release.json"
          release_http_status=''
          if ! release_http_status=$(curl --silent --show-error \
            --output "$existing_release" \
            --write-out '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG"); then
            printf 'Failed to query existing release %s\n' "$TAG" >&2
            exit 1
          fi
          case "$release_http_status" in
            200)
              jq -e --arg tag "$TAG" '
                .tag_name == $tag
                and (.draft | not)
                and (.prerelease | not)
                and (.published_at != null)
              ' "$existing_release" >/dev/null
              release_exists=true
              ;;
            404)
              release_exists=false
              ;;
            *)
              printf 'GitHub API returned %s while querying release %s\n' \
                "$release_http_status" "$TAG" >&2
              exit 1
              ;;
          esac
          printf 'release_exists=%s\n' "$release_exists" >> "$GITHUB_OUTPUT"

          stable_tags_file="$RUNNER_TEMP/stable-release-tags.txt"
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            > "$stable_tags_file"

          existing_versions=$(
            grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
              "$stable_tags_file" || true
          )
          latest_tag=$(printf '%s\n' "$existing_versions" | sed '/^$/d' | sort -V | tail -n 1)
          if [ "$release_exists" = true ]; then
            [ "$latest_tag" = "$TAG" ] || {
              printf 'Existing release %s is not the latest stable release (%s)\n' \
                "$TAG" "$latest_tag" >&2
              exit 1
            }
          elif [ -n "$latest_tag" ]; then
            highest=$(printf '%s\n%s\n' "$latest_tag" "$TAG" | sort -V | tail -n 1)
            if [ "$highest" != "$TAG" ] || [ "$TAG" = "$latest_tag" ]; then
              printf '%s must be newer than %s\n' "$TAG" "$latest_tag" >&2
              exit 1
            fi
          fi

          actual_previous_tag=$latest_tag
          if [ "$release_exists" = true ]; then
            actual_previous_tag=$(
              printf '%s\n' "$existing_versions" \
                | awk -v tag="$TAG" '$0 != tag' \
                | sed '/^$/d' \
                | sort -V \
                | tail -n 1
            )
          fi
          [ "$actual_previous_tag" = "$EXPECTED_PREVIOUS_TAG" ] || {
            printf 'Release notes use previous tag %s, but the current previous stable release is %s\n' \
              "${EXPECTED_PREVIOUS_TAG:-none}" "${actual_previous_tag:-none}" >&2
            exit 1
          }

          refs_file="$RUNNER_TEMP/tag-refs.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
            > "$refs_file"

          exact_count=$(jq --arg ref "refs/tags/$TAG" '[.[] | select(.ref == $ref)] | length' "$refs_file")
          if [ "$exact_count" -gt 1 ]; then
            printf 'More than one exact tag ref exists for %s\n' "$TAG" >&2
            exit 1
          fi

          if [ "$exact_count" -eq 1 ]; then
            object_type=$(jq -r --arg ref "refs/tags/$TAG" '.[] | select(.ref == $ref) | .object.type' "$refs_file")
            object_sha=$(jq -r --arg ref "refs/tags/$TAG" '.[] | select(.ref == $ref) | .object.sha' "$refs_file")
            [ "$object_type" = tag ] || {
              printf '%s exists but is not an annotated tag\n' "$TAG" >&2
              exit 1
            }

            tag_object="$RUNNER_TEMP/tag-object.json"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
              > "$tag_object"
            jq -e \
              --arg tag "$TAG" \
              --arg commit "$GITHUB_SHA" \
              '.tag == $tag
                and .object.type == "commit"
                and .object.sha == $commit
                and ((.message | rtrimstr("\n")) == ("Release " + $tag))' \
              "$tag_object" >/dev/null

            printf 'tag_exists=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'tag_exists=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Create annotated tag
        if: steps.preflight.outputs.tag_exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release_intent.outputs.tag }}
        run: |
          set -Eeuo pipefail

          tag_object_sha=$(
            jq -n \
              --arg tag "$TAG" \
              --arg message "Release $TAG" \
              --arg object "$GITHUB_SHA" \
              '{tag: $tag, message: $message, object: $object, type: "commit"}' \
              | gh api --method POST \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2026-03-10' \
                  "/repos/$GITHUB_REPOSITORY/git/tags" \
                  --input - \
                  --jq .sha
          )

          jq -n \
            --arg ref "refs/tags/$TAG" \
            --arg sha "$tag_object_sha" \
            '{ref: $ref, sha: $sha}' \
            | gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2026-03-10' \
                "/repos/$GITHUB_REPOSITORY/git/refs" \
                --input - \
                --silent

      - name: Publish GitHub Release
        if: steps.preflight.outputs.release_exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release_intent.outputs.tag }}
        run: |
          set -Eeuo pipefail
          gh release create "$TAG" \
            bundle/dist/awg-server-* \
            bundle/dist/SHA256SUMS \
            bundle/dist/SHA256SUMS.sig \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --fail-on-no-commits \
            --latest \
            --title "$TAG" \
            --notes-file bundle/release-notes.md

      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release_intent.outputs.tag }}
        run: |
          set -Eeuo pipefail

          release_file="$RUNNER_TEMP/release.json"
          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,publishedAt,body,assets \
            > "$release_file"

          jq -e --arg tag "$TAG" --rawfile expected_body bundle/release-notes.md '
            .tagName == $tag
            and (.isDraft | not)
            and (.isPrerelease | not)
            and (.publishedAt != null)
            and ((.body | rtrimstr("\n")) == ($expected_body | rtrimstr("\n")))
            and ([.assets[].name] | sort) == ([
              "SHA256SUMS",
              "SHA256SUMS.sig",
              "awg-server-darwin-amd64",
              "awg-server-darwin-arm64",
              "awg-server-linux-amd64",
              "awg-server-linux-arm64",
              "awg-server-windows-amd64.exe",
              "awg-server-windows-arm64.exe"
            ] | sort)
          ' "$release_file" >/dev/null

          published_dir="$RUNNER_TEMP/published-release"
          mkdir -p "$published_dir"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$published_dir"
          expected_assets=(
            SHA256SUMS
            SHA256SUMS.sig
            awg-server-darwin-amd64
            awg-server-darwin-arm64
            awg-server-linux-amd64
            awg-server-linux-arm64
            awg-server-windows-amd64.exe
            awg-server-windows-arm64.exe
          )
          for asset in "${expected_assets[@]}"; do
            cmp --silent "bundle/dist/$asset" "$published_dir/$asset" || {
              printf 'Published asset %s differs from the verified bundle\n' "$asset" >&2
              exit 1
            }
          done
